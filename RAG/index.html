<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FCCP Judgments Assistant</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1d2130;
    --accent: #c9a24b;
    --text: #e7e7ea;
    --muted: #8a8f9c;
    --user-bubble: #2a3142;
    --bot-bubble: #1d2130;
    --border: #262b38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
  }
  #sidebar {
    width: 260px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px;
  }
  #sidebar h2 {
    font-size: 15px; letter-spacing: 0.5px; color: var(--accent);
    margin: 0 0 14px 0; text-transform: uppercase;
  }
  #new-chat-btn {
    background: var(--accent); color: #171717; border: none; padding: 10px;
    border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 14px;
  }
  #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item {
    padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    color: var(--muted); background: transparent; border: 1px solid transparent;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .chat-item:hover { background: var(--panel-2); }
  .chat-item.active { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
  #user-box { margin-top: 14px; font-size: 12px; color: var(--muted); }
  #main { flex: 1; display: flex; flex-direction: column; }
  #header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    font-size: 16px; color: var(--accent); font-weight: 600;
  }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); }
  #input-area { display: flex; padding: 16px 24px; border-top: 1px solid var(--border); gap: 10px; }
  #input-area input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 14px;
  }
  #input-area button {
    background: var(--accent); color: #171717; border: none; padding: 12px 20px;
    border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  #empty-state { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
  
  /* Login Overlay styling */
  #login-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 17, 21, 0.95);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 360px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    animation: loginFadeIn 0.3s ease-out;
  }
  @keyframes loginFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .login-card h2 {
    color: var(--accent);
    margin: 0 0 10px 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .login-card p {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px 0;
  }
  .login-card input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 18px;
    outline: none;
    text-align: center;
  }
  .login-card input:focus {
    border-color: var(--accent);
  }
  .login-card button {
    width: 100%;
    background: var(--accent);
    color: #171717;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s;
  }
  .login-card button:hover {
    background: #dcb35c;
  }
  .auth-toggle-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    transition: color 0.2s;
  }
  .auth-toggle-link:hover {
    color: #ffffff;
  }
  .error-message {
    color: #e05c5c;
    font-size: 12px;
    margin-bottom: 14px;
    display: none;
    text-align: center;
  }
  
  #user-box {
    margin-top: 14px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #logout-btn {
    background: transparent;
    border: 1px solid #e05c5c;
    color: #e05c5c;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    transition: all 0.2s;
  }
  #logout-btn:hover {
    background: #e05c5c;
    color: #ffffff;
  }
</style>
</head>
<body>

<div id="login-overlay" style="display: none;">
  <div class="login-card">
    <h2 id="auth-title">Login</h2>
    <p id="auth-subtitle">Apna username daalein shuru karne ke liye</p>
    <div id="auth-error" class="error-message"></div>
    <input type="text" id="login-input" placeholder="Username..." />
    <button id="login-btn">Login</button>
    <div id="auth-toggle" class="auth-toggle-link">Naya account banayein? Sign Up</div>
  </div>
</div>

<div id="sidebar">
  <h2>FCCP Judgments</h2>
  <button id="new-chat-btn">+ New Chat</button>
  <div id="chat-list"></div>
  <div id="user-box">
    <div>Logged in as: <strong id="username-display"></strong></div>
    <button id="logout-btn">Logout</button>
  </div>
</div>

<div id="main">
  <div id="header">Judgments Assistant</div>
  <div id="messages"><div id="empty-state">Naya chat shuru karein ya sidebar se koi chat select karein.</div></div>
  <div id="input-area">
    <input id="msg-input" type="text" placeholder="Ask your question (Roman Urdu ya English)" />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000";
let userId = localStorage.getItem("fccp_user_id");
let username = localStorage.getItem("fccp_username");
let activeChatId = null;
let authMode = "login";

function showLoginScreen() {
  document.getElementById("login-overlay").style.display = "flex";
  document.getElementById("login-input").focus();
}

function hideLoginScreen() {
  document.getElementById("login-overlay").style.display = "none";
  // Reset fields and errors
  document.getElementById("login-input").value = "";
  const errorDiv = document.getElementById("auth-error");
  errorDiv.style.display = "none";
  errorDiv.textContent = "";
}

function toggleAuthMode() {
  const title = document.getElementById("auth-title");
  const subtitle = document.getElementById("auth-subtitle");
  const btn = document.getElementById("login-btn");
  const toggle = document.getElementById("auth-toggle");
  const errorDiv = document.getElementById("auth-error");
  
  errorDiv.style.display = "none";
  errorDiv.textContent = "";
  
  if (authMode === "login") {
    authMode = "signup";
    title.textContent = "Sign Up";
    btn.textContent = "Sign Up";
    toggle.textContent = "Login";
  } else {
    authMode = "login";
    title.textContent = "Login";
    btn.textContent = "Login";
    toggle.textContent = "Sign Up";
  }
}

async function ensureUser() {
  if (!username || !userId) {
    showLoginScreen();
    return false;
  }
  document.getElementById("username-display").textContent = username;
  return true;
}

async function handleLogin() {
  const input = document.getElementById("login-input");
  const value = input.value.trim();
  const errorDiv = document.getElementById("auth-error");
  
  errorDiv.style.display = "none";
  errorDiv.textContent = "";
  
  if (!value) return;

  const endpoint = authMode === "signup" ? "/auth/signup" : "/auth/login";
  
  try {
    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username: value })
    });
    
    const data = await res.json();
    if (!res.ok) {
      errorDiv.textContent = data.detail || "try again.";
      errorDiv.style.display = "block";
      return;
    }
    
    username = data.username;
    userId = data.id;
    localStorage.setItem("fccp_username", username);
    localStorage.setItem("fccp_user_id", userId);
    document.getElementById("username-display").textContent = username;
    
    hideLoginScreen();
    await loadChats();
  } catch (err) {
    console.error("Auth failed:", err);
    errorDiv.textContent = "Server se connect nahi ho saka.";
    errorDiv.style.display = "block";
  }
}

function handleLogout() {
  localStorage.removeItem("fccp_username");
  localStorage.removeItem("fccp_user_id");
  username = null;
  userId = null;
  activeChatId = null;
  document.getElementById("chat-list").innerHTML = "";
  document.getElementById("messages").innerHTML = '<div id="empty-state">Naya chat shuru karein ya sidebar se koi chat select karein.</div>';
  showLoginScreen();
}

async function loadChats() {
  if (!userId) return;
  const res = await fetch(`${API_BASE}/users/${userId}/chats`);
  const chats = await res.json();
  const list = document.getElementById("chat-list");
  list.innerHTML = "";
  chats.forEach(chat => {
    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
    div.textContent = chat.title;
    div.onclick = () => selectChat(chat.id);
    list.appendChild(div);
  });
}

async function createChat() {
  if (!userId) return;
  const res = await fetch(`${API_BASE}/chats`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ user_id: userId, title: "New Chat" })
  });
  const chat = await res.json();
  activeChatId = chat.id;
  await loadChats();
  renderMessages([]);
}

async function selectChat(chatId) {
  activeChatId = chatId;
  await loadChats();
  const res = await fetch(`${API_BASE}/chats/${chatId}/messages`);
  const msgs = await res.json();
  renderMessages(msgs);
}

function renderMessages(msgs) {
  const container = document.getElementById("messages");
  container.innerHTML = "";
  if (msgs.length === 0) {
    container.innerHTML = '<div id="empty-state">Sawal type karein aur judgments se jawab lein.</div>';
    return;
  }
  msgs.forEach(m => addBubble(m.role, m.content));
}

function addBubble(role, content) {
  const container = document.getElementById("messages");
  const empty = document.getElementById("empty-state");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;
  if (!activeChatId) await createChat();

  addBubble("user", text);
  input.value = "";

  const res = await fetch(`${API_BASE}/chats/${activeChatId}/messages`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ content: text })
  });
  const data = await res.json();
  addBubble("assistant", data.content);
  await loadChats(); // title update ho sakta hai
}

document.getElementById("new-chat-btn").onclick = createChat;
document.getElementById("send-btn").onclick = sendMessage;
document.getElementById("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

document.getElementById("login-btn").onclick = handleLogin;
document.getElementById("login-input").addEventListener("keydown", e => {
  if (e.key === "Enter") handleLogin();
});
document.getElementById("logout-btn").onclick = handleLogout;
document.getElementById("auth-toggle").onclick = toggleAuthMode;

(async function init() {
  const loggedIn = await ensureUser();
  if (loggedIn) {
    await loadChats();
  }
})();
</script>

</body>
</html>
